services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tinyurl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tinyurl
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres выполняет .sql из этой папки при первом запуске, когда каталог
      # данных пуст. Повторный up схему не трогает — чтобы накатить её заново,
      # нужно удалить том: docker compose down -v
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      # Только чтобы подключаться psql'ом с хоста; приложения ходят к базе
      # внутри compose-сети. 5433, потому что на хосте обычно уже есть свой
      # PostgreSQL на штатном порту.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyurl -d tinyurl"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Бэкенд сайта: регистрация, вход, управление слотами, статика фронтенда.
  api:
    build:
      context: .
      args:
        TARGET: api
    environment:
      # Хост базы — имя сервиса: внутри compose-сети docker резолвит его в
      # адрес контейнера.
      DBURL: postgres://tinyurl:${POSTGRES_PASSWORD}@db:5432/tinyurl?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      # Адрес, по которому доступны короткие ссылки, — то есть сервис
      # редиректов, а не сам api. Отсюда же берётся хост для проверки
      # самоссылок.
      BASE_URL: ${BASE_URL}
      WEB_DIR: /web
    ports:
      # Слева — порт хоста, справа — порт внутри контейнера. Внутренний
      # менять незачем, он ни с чем не пересекается.
      #
      # Только на loopback: наружу сервисы выставляет системный nginx,
      # напрямую из интернета они доступны быть не должны.
      - "127.0.0.1:${API_PORT:-8090}:8080"
    depends_on:
      db:
        # Не просто "запустись после db", а "дождись, пока она начнёт отвечать":
        # контейнер стартует за секунды, а Postgres готов принимать соединения
        # позже. Без этого приложение упало бы на первом же Ping.
        condition: service_healthy
    restart: unless-stopped

  # Переходы по коротким ссылкам. Отдельный сервис: ручка публичная,
  # запросов на порядки больше, и масштабируется он независимо от api.
  redirect:
    build:
      context: .
      args:
        TARGET: redirect
    environment:
      DBURL: postgres://tinyurl:${POSTGRES_PASSWORD}@db:5432/tinyurl?sslmode=disable
      # Редиректу токены не нужны, но LoadConfig требует ключ для всех
      # сервисов. Отдельный конфиг ради одного поля разводить не стали.
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
      BASE_URL: ${BASE_URL}
    ports:
      # Тоже только loopback, и здесь это критично: сервис доверяет заголовку
      # X-Forwarded-For безусловно. Будь он доступен напрямую, любой мог бы
      # записать в статистику произвольный IP.
      - "127.0.0.1:${REDIRECT_PORT:-8091}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
