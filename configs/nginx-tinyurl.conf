# Конфиг nginx для tinyURL.
#
# Установка на сервере:
#     sudo cp configs/nginx-tinyurl.conf /etc/nginx/sites-available/tinyurl
#     sudo ln -s /etc/nginx/sites-available/tinyurl /etc/nginx/sites-enabled/
#     sudo nginx -t          # проверка синтаксиса, ничего не применяет
#     sudo systemctl reload nginx
#
# Откат:
#     sudo rm /etc/nginx/sites-enabled/tinyurl && sudo systemctl reload nginx
#
# Порты 82 и 83 выбраны свободными: 80 и 81 уже заняты, 8080/8081 — тоже
# (amneziawg-web и x-ui). Проверить перед установкой:
#     ss -lntp | grep -E ':(82|83)'
#
# Когда появится домен, оба блока схлопываются в один server с
# server_name и разведением по location — см. комментарий в конце файла.

# ── Сайт: страницы и API ───────────────────────────────────────────────
server {
    listen 82;
    server_name _;

    # Длинные адреса пользователей ограничены 8000 символами, но с запасом
    # на заголовки.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Переходы по коротким ссылкам ───────────────────────────────────────
server {
    listen 83;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8091;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # Сервис редиректа доверяет этому заголовку и берёт из него IP для
        # статистики. $proxy_add_x_forwarded_for дописывает клиента к уже
        # существующей цепочке.
        #
        # Безопасно ровно потому, что контейнер слушает только 127.0.0.1:
        # снаружи к нему не подключиться в обход nginx, а значит подделать
        # заголовок нельзя.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Когда появится домен ───────────────────────────────────────────────
#
# Вместо двух портов — один server, где короткие коды уходят на редирект,
# а остальное на сайт:
#
# server {
#     listen 80;
#     server_name short.example.com;
#
#     # Ровно 8 символов из алфавита генератора — это короткий код.
#     location ~ "^/[A-Za-z0-9]{8}$" {
#         proxy_pass http://127.0.0.1:8091;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header Host $host;
#     }
#
#     location / {
#         proxy_pass http://127.0.0.1:8090;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header Host $host;
#     }
# }
#
# После этого BASE_URL в .env меняется на http://short.example.com,
# и сертификат ставится через certbot --nginx.
